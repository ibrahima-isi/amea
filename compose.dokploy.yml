# Canonical Dokploy stack; keep the existing project name to preserve its volumes.
services:
  public:
    build:
      context: .
      dockerfile: docker/Dockerfile.apps
      target: public
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: &shared_environment
      DB_HOST: db
      DB_NAME: ${DB_NAME:?set DB_NAME}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASS: ${DB_PASS:?set DB_PASS}
      APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
      APP_ENV: ${APP_ENV:-production}
      MAIL_USER: ${MAIL_USER:?set MAIL_USER}
      MAIL_PASS: ${MAIL_PASS:?set MAIL_PASS}
      MAIL_ASYNC: ${MAIL_ASYNC:-0}
    volumes:
      - amea_uploads:/opt/amea/uploads
      - amea_storage:/opt/amea/storage
      - amea_logs:/opt/amea/logs
      - public_sessions:/var/lib/amea/sessions
    tmpfs:
      - /opt/amea/storage/cache:uid=33,gid=33,mode=0770
    networks:
      - default
      - dokploy-network

  staff:
    build:
      context: .
      dockerfile: docker/Dockerfile.apps
      target: staff
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *shared_environment
      APP_URL: ${STAFF_APP_URL:?set STAFF_APP_URL}
      STAFF_APP_URL: ${STAFF_APP_URL:?set STAFF_APP_URL}
    volumes:
      - amea_uploads:/opt/amea/uploads
      - amea_storage:/opt/amea/storage
      - amea_logs:/opt/amea/logs
      - staff_sessions:/var/lib/amea/sessions
    tmpfs:
      - /opt/amea/storage/cache:uid=33,gid=33,mode=0770
    networks:
      - default
      - dokploy-network

  jobs:
    profiles: [jobs]
    build:
      context: .
      dockerfile: docker/Dockerfile.apps
      target: jobs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *shared_environment
      AMEA_TRASH_BACKUP_CONFIRMED: ${AMEA_TRASH_BACKUP_CONFIRMED:-0}
    volumes:
      - amea_uploads:/opt/amea/uploads
      - amea_storage:/opt/amea/storage
      - amea_logs:/opt/amea/logs
    tmpfs:
      - /opt/amea/storage/cache:uid=33,gid=33,mode=0770
    networks:
      - default

  # Runs all idempotent migrations on every deploy before the apps start.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.apps
      target: migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:?set DB_NAME}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASS: ${DB_PASS:?set DB_PASS}
    networks:
      - default

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:?set DB_NAME}
      MARIADB_USER: ${DB_USER:?set DB_USER}
      MARIADB_PASSWORD: ${DB_PASS:?set DB_PASS}
    volumes:
      - amea_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - default

volumes:
  amea_db:
  amea_uploads:
  amea_storage:
  amea_logs:
  public_sessions:
  staff_sessions:

networks:
  dokploy-network:
    external: true
