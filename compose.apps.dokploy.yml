# Configuration proposal only: reuse inventoried production data; never creates a DB.
services:
  public:
    image: ${AMEA_PUBLIC_IMAGE:?set immutable public image}
    build:
      context: .
      dockerfile: docker/Dockerfile.apps
      target: public
    restart: unless-stopped
    environment: &shared_environment
      DB_HOST: ${DB_HOST:?set existing database host on data network}
      DB_NAME: ${DB_NAME:?set existing database name}
      DB_USER: ${DB_USER:?set existing database user}
      DB_PASS: ${DB_PASS:?set existing database password}
      APP_ENV: production
      APP_URL: ${PUBLIC_APP_URL:?set public origin}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set public origin}
      STAFF_APP_URL: ${STAFF_APP_URL:?set staff origin}
      MAIL_USER: ${MAIL_USER:?set Brevo SMTP user}
      MAIL_PASS: ${MAIL_PASS:?set Brevo SMTP password}
      MAIL_ASYNC: '1'
    volumes:
      - uploads:/opt/amea/uploads
      - storage:/opt/amea/storage
      - logs:/opt/amea/logs
      - public_sessions:/var/lib/amea/sessions
    networks: [data, proxy]
  staff:
    image: ${AMEA_STAFF_IMAGE:?set immutable staff image}
    build:
      context: .
      dockerfile: docker/Dockerfile.apps
      target: staff
    restart: unless-stopped
    environment:
      <<: *shared_environment
      APP_URL: ${STAFF_APP_URL:?set staff origin}
    volumes:
      - uploads:/opt/amea/uploads
      - storage:/opt/amea/storage
      - logs:/opt/amea/logs
      - staff_sessions:/var/lib/amea/sessions
    networks: [data, proxy]
  jobs:
    profiles: [jobs]
    image: ${AMEA_JOBS_IMAGE:?set immutable jobs image}
    build:
      context: .
      dockerfile: docker/Dockerfile.apps
      target: jobs
    restart: unless-stopped
    environment:
      <<: *shared_environment
      AMEA_TRASH_BACKUP_CONFIRMED: ${AMEA_TRASH_BACKUP_CONFIRMED:-0}
    volumes:
      - uploads:/opt/amea/uploads
      - storage:/opt/amea/storage
      - logs:/opt/amea/logs
    networks: [data]
volumes:
  uploads:
    external: true
    name: ${AMEA_UPLOADS_VOLUME:?set inventoried existing uploads volume}
  storage:
    external: true
    name: ${AMEA_STORAGE_VOLUME:?set inventoried existing storage volume}
  logs:
    external: true
    name: ${AMEA_LOGS_VOLUME:?set inventoried existing logs volume}
  public_sessions:
  staff_sessions:
networks:
  data:
    external: true
    name: ${AMEA_DATA_NETWORK:?set existing database network}
  proxy:
    external: true
    name: ${AMEA_PROXY_NETWORK:-dokploy-network}
