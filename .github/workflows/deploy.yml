name: PHP CI (no deployment)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@8358ee0e2e8afe63c2fb8253d1d52085811ab1e5 # v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: |
          php tests/test_permissions_unit.php
          php tests/test_oop_unit.php
          php tests/test_oop_integration.php
          php tests/test_password_reset_security.php
          ./vendor/bin/phpunit --colors=never
