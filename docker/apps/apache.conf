<VirtualHost *:80>
    DocumentRoot /var/www/amea
    <Directory /var/www/amea>
        AllowOverride None
        Options -Indexes -MultiViews
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/assets/.+\.(css|js|json|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf)$ [NC]
        RewriteCond %{REQUEST_URI} !^/uploads/slider/[^/]+\.(png|jpg|jpeg|gif|webp)$ [NC]
        RewriteRule ^ index.php [END]
    </Directory>
    Alias /uploads/slider/ /opt/amea/uploads/slider/
    <Directory /opt/amea/uploads/slider>
        AllowOverride None
        Options -Indexes
        Require all denied
        <FilesMatch "(?i)^(?!.*\.(?:php[0-9]?|phtml|phar)(?:\.|$)).+\.(?:png|jpe?g|gif|webp)$">
            Require expr "%{REQUEST_URI} =~ m#^/uploads/slider/[^/]+$#"
            SetHandler none
            Header set X-Content-Type-Options "nosniff"
        </FilesMatch>
    </Directory>
</VirtualHost>
