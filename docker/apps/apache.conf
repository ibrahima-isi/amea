<VirtualHost *:80>
    DocumentRoot AMEA_DOCUMENT_ROOT
    <Directory AMEA_DOCUMENT_ROOT>
        AllowOverride None
        Options -Indexes -MultiViews
        Require all granted
        php_value session.save_path "/var/lib/amea/sessions"
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/assets/.+\.(css|js|json|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf)$ [NC]
        RewriteRule ^ index.php [END]
    </Directory>
</VirtualHost>
