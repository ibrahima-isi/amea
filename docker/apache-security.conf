ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    AllowOverride All
    Options -Indexes
    Require all granted
</Directory>

# Prevent direct access to application internals and secrets.
<DirectoryMatch "^/var/www/html/(config|src|functions|templates|database|migrations|tests|docs|plans|scripts|storage|logs|vendor|accounting|\.codex)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(\.env.*|\.gitignore|composer\.(json|lock)|compose.*\.ya?ml|Dockerfile|phpunit\.xml|schema\.sql)$">
    Require all denied
</FilesMatch>

# Student uploads remain writable by PHP, but are never served as static files.
# The rule is in the image (not the uploads volume), so it survives volume replacement.
<Directory /var/www/html/uploads/students>
    Require all denied
</Directory>

# Never execute an uploaded PHP script.
<Directory /var/www/html/uploads>
    <FilesMatch "\.p(hp[0-9]?|html|har)$">
        Require all denied
    </FilesMatch>
</Directory>
